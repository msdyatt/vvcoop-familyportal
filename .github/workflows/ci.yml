name: CI

# Runs on every push and PR against main -- build, lint, typecheck, and the
# test suite, all of which need nothing but the repo itself (no Cloudflare or
# Supabase credentials). On a push to main only (not PRs -- a PR from a fork
# has no access to secrets, and shouldn't deploy anyway), three further jobs
# redeploy the Worker, the Supabase Edge Functions, and any new Supabase
# migrations, all gated on build-lint-test succeeding first -- so GitHub, not
# whatever happens to be sitting in someone's local working tree, is the
# source of truth for what's live.
#
# supabase-migrations runs actual SQL against Postgres directly (unlike
# `functions deploy`, which goes through the Management API) -- worth calling
# out because it looks like it should need a database password on top of
# SUPABASE_ACCESS_TOKEN, and the CLI's own --help text for `db push`/`link`
# suggests exactly that. Verified live (27 Aug) that it doesn't: a linked
# session authenticates the direct DB connection through the access token
# alone in this CLI version, confirmed by watching a real (harmless, since
# reverted) test migration actually apply through this exact job with no
# password supplied at all -- not just a "nothing pending" no-op.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      # NODE_ENV=development on every step: this Mac's local shell has been
      # seen with NODE_ENV=production set, which makes npm skip
      # devDependencies entirely (ESLint, TypeScript, Vite, wrangler...) --
      # see HANDOFF.md. Runner environments default NODE_ENV unset, but
      # setting it explicitly here keeps this workflow correct regardless of
      # whatever a future runner image defaults to.
      - run: npm ci
        env:
          NODE_ENV: development

      - run: npm run lint
        env:
          NODE_ENV: development

      - run: npm run typecheck
        env:
          NODE_ENV: development

      - run: npm test
        env:
          NODE_ENV: development

  # Edge functions are TypeScript for the Deno runtime, which npm run typecheck
  # never sees. This type-checks each one and runs the unit tests (calendar
  # recurrence, the invitation delete/resend guards, shared helpers).
  edge-function-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.8.2

      - name: Type-check every edge function
        run: |
          set -e
          for dir in supabase/functions/*/; do
            [ -f "$dir/index.ts" ] || continue
            echo "== $dir"
            (cd "$dir" && deno check --node-modules-dir=none --config deno.json index.ts)
          done

      - name: Unit tests
        run: |
          cd supabase/functions
          deno test --node-modules-dir=none --config invite-family-admin/deno.json _shared/ calendar-feed/

  # Replays every migration into a fresh local Supabase, then runs the pgTAP
  # tests in supabase/tests/database. Proves two things at once: that the
  # migration history still builds a working database from scratch, and that
  # the permission rules behind past incidents still hold.
  database-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned for the same reason as the deploy jobs below.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      # Production has tables and columns that were created by hand and never
      # appeared in a migration. These stand-ins are dropped into this
      # throwaway database's migration list at the point each is needed
      # (their filenames carry the version they slot in at). Never committed,
      # never applied anywhere else. See supabase/tests/bootstrap.
      - name: Add the hand-made-object baseline among the migrations
        run: cp supabase/tests/bootstrap/*.sql supabase/migrations/

      - name: Start a local Supabase
        run: supabase start -x studio,mailpit,imgproxy,vector,logflare,edge-runtime

      - name: Run database tests
        run: supabase test db

  deploy:
    needs: build-lint-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID live as Environment secrets
    # on "Production" (scoped to Account > Workers Scripts > Edit -- see
    # HANDOFF.md), not repo-level secrets -- a job only sees Environment
    # secrets for an environment it explicitly declares here.
    environment: Production
    # A Cloudflare API token scoped to Account > Workers Scripts > Edit on
    # this one account only (see HANDOFF.md) -- no zone/DNS permission, since
    # this deploy never touches the Custom Domain attachment, only the Worker
    # script and its static assets.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - run: npm ci
        env:
          NODE_ENV: development

      # Same build the build-lint-test job already ran -- re-running it here
      # rather than passing an artifact between jobs keeps this job simple
      # and self-contained, and it's a ~1s vinext build, not worth optimizing.
      - run: npm run build
        env:
          NODE_ENV: development

      # The exact command HANDOFF.md has documented as the manual deploy step
      # throughout this project -- `--name veritas-village` is load-bearing:
      # a bare `wrangler deploy` has landed on a stray leftover Worker before.
      - run: npx wrangler deploy --config dist/server/wrangler.json --name veritas-village dist/server/index.js
        env:
          NODE_ENV: development
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  supabase-functions:
    needs: build-lint-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Pinned, not `latest`: v3.0.0 (2 Nov 2026) flipped `db push` to target a
      # local stack by default and made `functions deploy` demand --yes, which
      # broke both deploy jobs on the next push. Move to v3 deliberately.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      # supabase/config.toml's [functions.*] verify_jwt values are the
      # authoritative source here -- deploying without them (or with a stale
      # value) can silently flip a function's platform-level JWT gate. Two of
      # these (opensign-send, opensign-sync) handle their own CORS preflight
      # and must stay verify_jwt=false, or their OPTIONS requests -- which
      # carry no Authorization header -- get rejected before the function's
      # own OPTIONS branch ever runs. See config.toml's own note on this.
      - run: supabase functions deploy --project-ref jtwemgyhxylbhjzxgyvh

  supabase-migrations:
    needs: build-lint-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Pinned, not `latest`: v3.0.0 (2 Nov 2026) flipped `db push` to target a
      # local stack by default and made `functions deploy` demand --yes, which
      # broke both deploy jobs on the next push. Move to v3 deliberately.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      # No database password needed -- see the job-level comment above for why
      # that's worth calling out. If a future CLI version changes this and
      # `link` starts failing here, add SUPABASE_DB_PASSWORD as a Production
      # environment secret (Supabase dashboard -> Project Settings ->
      # Database -> Database password) and pass it as `--password`.
      #
      # Every migration filename's timestamp must equal its real
      # apply_migration version exactly (db push matches by version number,
      # not name) -- see HANDOFF.md's "Migration filenames must carry their
      # real apply_migration timestamp" note before ever hand-editing one.
      - run: supabase link --project-ref jtwemgyhxylbhjzxgyvh

      - run: supabase db push
